<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리들의 실시간 돌림판</title><style>
*{box-sizing:border-box}body{margin:0;background:#f9f6f2;color:#272626;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}main{max-width:530px;margin:auto;padding:28px 18px 50px;text-align:center}.eyebrow{font-size:12px;font-weight:750;letter-spacing:2px;color:#ac7c62}.title{font-size:29px;letter-spacing:-1.4px;margin:9px 0 7px}.sub{font-size:13px;color:#8b817b;margin:0 0 26px}.stage{background:white;border-radius:28px;padding:24px 12px 20px;box-shadow:0 9px 38px #9d87721a}.wheel-wrap{width:min(83vw,370px);height:min(83vw,370px);margin:0 auto 22px;position:relative}.wheel{position:absolute;inset:8px;border:9px solid #fff;border-radius:50%;box-shadow:0 0 0 3px #e7dbd2,0 8px 19px #0001;background:conic-gradient(from -36deg,#f6cabb 0deg 72deg,#f6dfaa 72deg 144deg,#bfddc8 144deg 216deg,#bfd7ee 216deg 288deg,#d9c8e9 288deg 360deg);transform:rotate(0deg);will-change:transform}.wheel .name{position:absolute;left:50%;top:50%;width:65px;margin-left:-32.5px;margin-top:-14px;font-size:23px;font-weight:900;letter-spacing:-1px;color:#3e3430}.pointer{position:absolute;left:50%;top:0;transform:translateX(-50%);border-left:15px solid transparent;border-right:15px solid transparent;border-top:29px solid #44352f;z-index:3;filter:drop-shadow(0 2px 2px #0003)}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:5px solid #f8f4ee;border-radius:50%;width:74px;height:74px;display:grid;place-items:center;font-size:16px;font-weight:900;box-shadow:0 2px 10px #0002}.result{font-size:23px;font-weight:900;min-height:39px;letter-spacing:-.6px}.status{font-size:12px;margin:6px 0 18px;color:#827974}.action{border:0;width:min(100%,310px);background:#dd7459;color:#fff;padding:16px;border-radius:15px;font-size:17px;font-weight:850;cursor:pointer}.action:disabled{background:#c5b5ae;cursor:default}.tags{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:18px 0 4px}.tag{background:#faf3ec;padding:7px 13px;border-radius:30px;font-size:13px;font-weight:750}.history{text-align:left;background:white;border-radius:22px;margin-top:16px;padding:19px 21px;box-shadow:0 6px 24px #9d877215}.history h2{font-size:15px;margin:0 0 12px}.item{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid #f1eeeb;font-size:14px}.item strong{color:#d3654d}.muted{color:#9a918b}.adminnote{font-size:12px;color:#a08c80;margin-top:10px}.link{border:1px solid #e4d9d1;background:#fff;color:#50443d;padding:11px 14px;border-radius:12px;font-weight:700;cursor:pointer;margin:14px 0 0}.tiny{font-size:11px;color:#9b9188;margin-top:16px}
</style></head><body><main><div class="eyebrow">TOGETHER • RANDOM</div><h1 class="title">우리들의 돌림판 🎡</h1><p class="sub">추 · 현 · 송 · 김 · 노 / 5명 무제한 추첨</p>
<section class="stage"><div class="wheel-wrap"><div class="wheel" id="wheel"></div><div class="pointer"></div><div class="hub">GO!</div></div><div class="result" id="result" aria-live="polite">준비 완료!</div><div class="status" id="status" aria-live="polite">연결 중…</div><button class="action" id="spin" hidden>🎲 돌림판 돌리기</button><div class="tags" id="counts"></div></section><button class="link" id="copy">🔗 친구에게 관람 링크 복사</button><p class="adminnote" id="adminnote"></p><section class="history"><h2>🕒 추첨 기록 <span id="total"></span></h2><div id="history" class="muted">아직 추첨 기록이 없어요.</div></section><div class="tiny">링크를 열어두면 자동으로 결과를 받아요 · 재접속해도 기록 유지</div></main>
<script>
const room='d09b7c56-833a-435e-8313-03223e38edae', players=['추','현','송','김','노'];
const api='https://rhkyvdnquiserrrjjeoz.supabase.co/functions/v1/friends-wheel';const token=new URLSearchParams(location.hash.slice(1)).get('admin');const admin=!!token;
const wheel=document.getElementById('wheel'),spin=document.getElementById('spin'),result=document.getElementById('result'),status=document.getElementById('status');
const history=document.getElementById('history'),counts=document.getElementById('counts'),total=document.getElementById('total');
const radius=140;let latest=0,busy=false,finishTimer=null,ready=false,angle=0,requesting=false;
players.forEach((name,i)=>{let t=document.createElement('span');t.className='name';t.textContent=name;t.style.transform='rotate('+(i*72)+'deg) translateY(-'+radius+'px) rotate('+(-i*72)+'deg)';wheel.append(t)});
spin.hidden=!admin;document.getElementById('adminnote').textContent=admin?'🔒 관리자 모드 · 이 주소는 다른 사람에게 공유하지 마세요.':'👀 관람 모드 · 관리자만 돌릴 수 있어요.';
document.getElementById('copy').addEventListener('click',async()=>{const u=location.origin+location.pathname;try{await navigator.clipboard.writeText(u);document.getElementById('copy').textContent='✅ 관람 링크 복사 완료'}catch{prompt('아래 링크를 복사하세요',u)}});
function render(data){const list=data.spins||[];total.textContent='('+list.length+'회)';const nums=players.map(p=>list.filter(s=>s.winner_name===p).length);counts.replaceChildren();players.forEach((p,i)=>{let e=document.createElement('span');e.className='tag';e.textContent=p+' '+nums[i]+'회';counts.append(e)});history.replaceChildren();list.slice(0,25).forEach(s=>{const e=document.createElement('div');e.className='item';const a=document.createElement('span');a.textContent=s.spin_number+'번째 추첨';const b=document.createElement('strong');b.textContent=s.winner_name+' 당첨';e.append(a,b);history.append(e)});if(!list.length)history.textContent='아직 추첨 기록이 없어요.';
if(!list.length){if(!ready){result.textContent='준비 완료!';status.textContent='● 실시간 연결 중';}ready=true;spin.disabled=false;return}
const s=list[0],end=new Date(s.started_at).getTime()+s.duration_ms;const remaining=end-Date.now();const isNew=s.id!==latest;
if(isNew){latest=s.id;clearTimeout(finishTimer);wheel.style.transition='none';wheel.style.transform='rotate('+s.start_degrees+'deg)';void wheel.offsetWidth;angle=s.target_degrees;if(remaining>0){wheel.style.transition='transform '+remaining+'ms cubic-bezier(.13,.72,.1,1)';wheel.style.transform='rotate('+angle+'deg)';busy=true;result.textContent='🎲 돌아가는 중…';status.textContent='모든 친구에게 같은 결과가 전달돼요';finishTimer=setTimeout(()=>{busy=false;result.textContent='🎉 '+s.winner_name+' 당첨!';status.textContent='모두에게 결과가 공유됐어요';spin.disabled=false},remaining+120)}else{wheel.style.transform='rotate('+angle+'deg)';result.textContent='🎉 '+s.winner_name+' 당첨!';busy=false;status.textContent='● 결과 동기화 완료';}}
spin.disabled=busy||requesting;ready=true;
}
async function sync(){try{const r=await fetch(api+'/state?room='+room,{cache:'no-store'});if(!r.ok)throw Error('네트워크 오류');const d=await r.json();render(d)}catch(e){status.textContent='연결 재시도 중…';spin.disabled=true}}
spin.addEventListener('click',async()=>{if(busy||requesting)return;requesting=true;spin.disabled=true;status.textContent='추첨 요청 중…';try{const r=await fetch(api+'/spin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room,token})});const x=await r.json();if(!r.ok)throw Error(x.error||'잠시 후 다시 시도하세요');await sync()}catch(e){status.textContent=e.message}finally{requesting=false;if(!busy)spin.disabled=false}});
sync();setInterval(sync,1100);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
</script></body></html>
